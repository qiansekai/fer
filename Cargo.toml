[package]
name = "file-engine-rust"
version = "0.1.0"
edition = "2024"
description = "fer — File Express Retriever: Everything-grade instant file search for NTFS, raw $MFT indexing, mmap zero-copy in-memory engine, CLI + HTTP API"
license = "GPL-3.0"
repository = "https://github.com/qiansekai/fer"
readme = "README.md"

[features]
# 桌面 GUI 前端（src/bin/fer-gui）：默认不编，`--features gui` 才产出 fer-gui.exe。
gui = ["dep:winsafe"]

[[bin]]
name = "fer"
path = "src/main.rs"

[[bin]]
name = "fer-gui"
path = "src/bin/fer-gui/main.rs"
required-features = ["gui"]

[dependencies]
anyhow = "1.0.104"
# Server only needs http1 + json + query (+ the tokio integration for axum::serve).
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.6", features = ["derive"] }
memchr = "2.8.3"
memmap2 = "0.9"
# Bytes-only usage (names are pre-lowercased) — unicode feature off keeps the
# crate's big Unicode tables out of the binary; \p{...} patterns then error
# at parse with a clear message.
regex = { version = "1.12", default-features = false, features = ["std", "perf"] }
# Already a transitive dep of `regex` (same version from the lockfile cache):
# used only for literal extraction in the regex prefilter (regex_literal_seeds).
regex-syntax = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Only rt-multi-thread (Runtime::new/block_on) + net (TcpListener) are used;
# "full" pulled in signal/process/time/io-util/fs for nothing.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net"] }
walkdir = "2.5.0"
# 桌面 GUI 前端用 winsafe（宿主 Win32 控件封装）；只在 --features gui 时编译。
winsafe = { version = "0.0.29", features = ["gui"], optional = true }
# GUI 侧额外需要 DataExchange（剪贴板）/ Memory / Time（本地时间，含 DST）。
# features 是 crate 级并集，主 bin 也会带上，但不受影响。
# 注：ShellExecuteW 刻意不用本 crate 的绑定 —— 0.61.2 里 UI/Shell 的每个条目还被
# Win32_UI_WindowsAndMessaging 二次门控（Win32_UI_Shell = ["Win32_UI"] 拉不出来），
# 故在 fer-gui 的 actions.rs 里按 Win32 文档自声明同签名 extern（与 GlobalFree 同一先例）。
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    # ReadProcessMemory: fer lock reads a target cwd out of its PEB.
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

# Speed profile: this machine only (target-cpu=native via .cargo/config.toml).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

# Size-optimized alternative: `cargo build --profile min-size`.
[profile.min-size]
inherits = "release"
opt-level = "z"
